    const fromBase64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    document.getElementById('unlock').addEventListener('submit',async e=>{
      e.preventDefault();
      const button=document.getElementById('submit');
      const message=document.getElementById('message');
      button.disabled=true; button.textContent='正在解密…'; message.textContent='';
      try{
        const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);
        const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromBase64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
        const bytes=fromBase64(payload.data);
        const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(payload.iv),tagLength:128},key,bytes);
        const html=new TextDecoder().decode(plain);
        document.open(); document.write(html); document.close();
      }catch{
        message.textContent='密码不正确，请重新输入。';
        button.disabled=false; button.textContent='解锁并查看';
        document.getElementById('password').select();
      }
    });
